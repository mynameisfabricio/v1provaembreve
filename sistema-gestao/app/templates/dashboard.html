<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Magazine Construções</title>
    
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/dashboard.css"> 
    <link rel="stylesheet" href="../static/css/responsive.css">
    
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

    <header class="header-top-bar">
        <div class="top-bar-content">
            <div class="contact-info">
                <a href="httpsasa://wa.me/5585912345678" target="_blank" class="top-link">
                    <i data-feather="message-circle"></i>
                    <span>(85) 91234-5678 (WhatsApp)</span>
                </a>
            </div>
            <div class="admin-login">
                <a href="index.html" class="top-link">
                    <i data-feather="log-out"></i> Sair do Painel
                </a>
            </div>
        </div>
    </header>

    <header class="header-main">
        <div class="header-content">
            <a href="index.html" class="logo">Magazine Construções</a>
            
            <div class="header-actions">
                 <span class="admin-indicator"><i data-feather="shield"></i> Painel do Admin</span>
            </div>
        </div>
    </header>
    
    <nav class="category-nav" id="category-nav">
        <div class="nav-content">
             <span style="color: white; font-weight: 500;">Gerenciamento de Produtos</span>
        </div>
    </nav>

    <main class="main-content">
        
        <h1 class="page-title">Dashboard - Adicionar Produto</h1>
        
        <div class="dashboard-layout">
            
            <section class="add-product-form">
                <h2>Cadastrar Novo Produto</h2>
                <form id="product-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nome">Nome do Produto:</label>
                            <input type="text" id="nome" name="nome" required>
                        </div>
                        <div class="form-group">
                            <label for="categoria">Categoria:</label>
                            <input type="text" id="categoria" name="categoria" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="valor">Valor (R$):</label>
                            <input type="number" id="valor" name="valor" step="0.01" min="0" required placeholder="Ex: 49.90">
                        </div>
                         <div class="form-group">
                            <label>Produto em Desconto?</label>
                            <div class="radio-group">
                                <label><input type="radio" name="tem_desconto" value="nao" checked> Não</label>
                                <label><input type="radio" name="tem_desconto" value="sim"> Sim</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" id="desconto-valor-group" style="display: none;">
                        <label for="desconto_valor">Valor do Desconto (R$):</label>
                        <input type="number" id="desconto_valor" name="desconto_valor" step="0.01" min="0" placeholder="Ex: 10.00">
                    </div>
                   
                    <div class="form-group">
                        <label for="descricao">Descrição:</label>
                        <textarea id="descricao" name="descricao" rows="4"></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Adicionar Produto</button>
                </form>
            </section>

            <section class="product-list">
                <h2>Produtos Cadastrados</h2>
                <div id="lista-produtos-cadastrados">
                    <p>Nenhum produto cadastrado ainda.</p>
                    </div>
            </section>

        </div> </main> <footer class="site-footer"> ... </footer>
    
    <script src="../static/js/main.js"></script> 
    <script src="../static/js/dashboard.js"></script> </body>
</html>
