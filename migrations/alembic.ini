# A generic, single database configuration.

[alembic]
# Path to your alembic script file, default is %(here)s
# script_location = %(here)s

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# --- ADICIONADO PARA TENTAR CORRIGIR O FileNotFoundError ---
# Define explicitamente onde ficam os scripts de versão
# %(here)s se refere à pasta onde este alembic.ini está (a pasta migrations)
version_locations = %(here)s/versions
# -----------------------------------------------------------


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S